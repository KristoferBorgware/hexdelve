<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Hexdelve — client</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; overflow: hidden; }
		body {
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			background: #c4d6c8;
		}
		#scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
		#hud {
			position: fixed; top: 14px; left: 14px;
			display: flex; align-items: center; gap: 10px;
			padding: 8px 12px; border-radius: 9px;
			background: rgba(252, 253, 250, 0.82);
			border: 1px solid rgba(60, 80, 60, 0.14);
			font-size: 12.5px; color: #2c3a2e;
		}
		#hud b { font-weight: 620; }
		#backend {
			padding: 2px 7px; border-radius: 5px;
			background: #5c7a3c; color: #fff;
			font-size: 11px; font-weight: 650; letter-spacing: 0.02em;
		}
	</style>
</head>
<body>
	<canvas id="scene"></canvas>
	<div id="hud">
		<b>Hexdelve</b>
		<span id="backend">starting…</span>
		<span>drag to orbit · wheel to zoom · right-drag to pan</span>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
