# Typecheck and build the monorepo on every branch and pull request.
#
# The deploy workflow does the same work before publishing, but only on main.
# This is the copy that runs before a change gets there.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The tarball cache, which is what saves the DOWNLOAD on the miss
          # path below. It does not save the install; that is the next step.
          cache: npm

      # The installed tree itself, which is the whole of the seven minutes.
      #
      # `npm ci` DELETES node_modules before it installs, so caching the tree
      # and then running `npm ci` anyway would throw the cache away every time.
      # The install has to be skipped on a hit, which is what the `if` below
      # does — and it is why `cache: npm` alone never helped: 424 packages and
      # 445 MB were being re-extracted on every run whether or not the download
      # was cached.
      #
      # Keyed on the lockfile, so any dependency change misses and reinstalls.
      - name: Restore the installed tree
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        # The flags are belt and braces over the repository's .npmrc, so that
        # this step says what it does rather than depending on a file two
        # directories up.
        #
        # `--no-audit` is the one that mattered. The audit POSTs the whole tree
        # and waits, and during a registry incident on 2026-09-04 that request
        # took 276 seconds against about 20ms for every other request in the
        # same install — the whole of the seven minutes this step used to take.
        # The outage passed; the reason not to depend on it did not. See the
        # repository's .npmrc, which turns the same thing off for everybody.
        #
        # `--ignore-scripts` is a smaller saving. The only install script that
        # runs on Linux is electron-winstaller's, which prepares a Windows
        # installer no job here builds; the other two are `fsevents`, which is
        # macOS-only. No package in this repository has a `prepare` or
        # `postinstall` of its own.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck every package
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack and check the asset files
        # A YAML file has no compiler. Packing loads every entity through the
        # same readers the game uses, so a mesh naming a bone its rig does not
        # have fails here rather than when somebody opens the editor.
        run: node tools/build-assets.mjs

      - name: Test
        # Everything the project can assert without somebody looking at a
        # screen, in one runner. Three of the six drive a browser, and skip
        # rather than fail when there is none to drive:
        #
        #   picking     a screen point has to map back to the ground drawn
        #               there — a camera basis derived twice is a sign waiting
        #               to be got wrong, and nothing throws when it is
        #   blend-tree  a tree that has drifted out of phase still produces a
        #               valid pose; the only symptom is a character who skates
        #   tiles       every mistake available in a WFC tileset still produces
        #               levels: a rotation that turns the wrong way bends
        #               corridors the wrong way, an asymmetric propagator
        #               drifts the solver's counts, an orphaned tile is simply
        #               never placed
        #   shaders     WebGPU marks a bad pipeline invalid rather than
        #               throwing, so a broken shader reaches a browser looking
        #               healthy and fails on the first draw
        #   render      none of the above would notice a sign flip that put
        #               every shadow on the wrong side, so a picture is kept in
        #               the repository and compared against
        #   backends    the two shader sets are written twice on purpose; this
        #               is what stops them drifting apart. Needs a working
        #               WebGPU device and usually skips for want of one.
        run: npm test

      - name: Upload the render diff
        # Only reachable when the comparison failed, and it is the only way to
        # see what changed from a log.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: /tmp/render-*.png
          if-no-files-found: ignore

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs assets tools -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"
