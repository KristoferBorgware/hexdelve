# Typecheck and build the monorepo on every branch and pull request.
#
# The deploy workflow does the same work before publishing, but only on main.
# This is the copy that runs before a change gets there.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check picking agrees with the projection
        # A camera basis derived twice is a sign waiting to be got wrong, and
        # nothing throws when it is: the cursor simply stops landing where it
        # is pointing. This round-trips screen points through the real matrix.
        run: npm run check:picking

      - name: Check the shaders compile and the pipelines build
        # Catches a WGSL or GLSL mistake at the point it is made. WebGPU marks
        # a bad pipeline invalid rather than throwing, so without this a broken
        # shader reaches a browser looking healthy and only fails on the first
        # draw. Uses the runner's own Chrome, so there is no browser to
        # download; the script skips itself if it cannot find one.
        run: npm run check:shaders

      - name: Check the two backends draw the same picture
        # Captures a frame from each off the GPU and diffs them. Skips the
        # comparison, without failing, on a runner with no usable WebGPU
        # device — which is most of them; it still proves WebGL2 renders.
        run: npm run check:backends

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs assets tools -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"
