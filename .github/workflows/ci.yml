# Typecheck and build the monorepo on every branch and pull request.
#
# The deploy workflow does the same work before publishing, but only on main.
# This is the copy that runs before a change gets there.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        # Everything the project can assert without somebody looking at a
        # screen, in one runner. Three of the five drive a browser, and skip
        # rather than fail when there is none to drive:
        #
        #   picking     a screen point has to map back to the ground drawn
        #               there — a camera basis derived twice is a sign waiting
        #               to be got wrong, and nothing throws when it is
        #   blend-tree  a tree that has drifted out of phase still produces a
        #               valid pose; the only symptom is a character who skates
        #   shaders     WebGPU marks a bad pipeline invalid rather than
        #               throwing, so a broken shader reaches a browser looking
        #               healthy and fails on the first draw
        #   render      none of the above would notice a sign flip that put
        #               every shadow on the wrong side, so a picture is kept in
        #               the repository and compared against
        #   backends    the two shader sets are written twice on purpose; this
        #               is what stops them drifting apart. Needs a working
        #               WebGPU device and usually skips for want of one.
        run: npm test

      - name: Upload the render diff
        # Only reachable when the comparison failed, and it is the only way to
        # see what changed from a log.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: /tmp/render-*.png
          if-no-files-found: ignore

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs assets tools -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"
