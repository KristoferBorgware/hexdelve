# Typecheck and build the monorepo on every branch and pull request.
#
# The deploy workflow does the same work before publishing, but only on main.
# This is the copy that runs before a change gets there.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check picking agrees with the projection
        # A camera basis derived twice is a sign waiting to be got wrong, and
        # nothing throws when it is: the cursor simply stops landing where it
        # is pointing. This round-trips screen points through the real matrix.
        run: npm run check:picking

      - name: Check the blend tree blends what it says it does
        # The failure this catches is the one nothing throws for: two gaits
        # drifting out of phase still produce sensible weights and a valid
        # pose, and the only symptom is a character who skates. Asserts the
        # thresholds, the sync, the additive gain and the mask.
        run: npm run check:blend

      - name: Check the dungeon tileset is what it says it is
        # The same class of failure as the blend check: every mistake available
        # in a WFC tileset still produces levels. A rotation that turns the
        # wrong way bends corridors the wrong way, an asymmetric propagator
        # drifts the solver's supporter counts, and a tile with no legal
        # neighbour is silently never placed. None of them throws and all of
        # them look like a dungeon.
        run: npm run check:tiles

      - name: Check the shaders compile and the pipelines build
        # Catches a WGSL or GLSL mistake at the point it is made. WebGPU marks
        # a bad pipeline invalid rather than throwing, so without this a broken
        # shader reaches a browser looking healthy and only fails on the first
        # draw. Uses the runner's own Chrome, so there is no browser to
        # download; the script skips itself if it cannot find one.
        run: npm run check:shaders

      - name: Check the yard still renders as it did
        # The other checks prove the code is well formed without ever looking
        # at a picture: none of them would notice a sign flip that put every
        # shadow on the wrong side. This draws the scene through WebGL2 and
        # compares it against tools/reference/yard-webgl2.png. WebGL2 only,
        # because a runner reliably has a software rasteriser and reliably has
        # no WebGPU device; check:backends compares the two, and stays local
        # for that reason.
        run: npm run check:render

      - name: Upload the render diff
        # Only reachable when the comparison failed, and it is the only way to
        # see what changed from a log.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: /tmp/render-*.png
          if-no-files-found: ignore

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs assets tools -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"
