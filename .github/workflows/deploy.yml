# Publish the site to GitHub Pages on every push to main.
#
# The site is three things served side by side, staged by tools/build-pages.js:
#
#   /              the landing page, generated from the labs themselves
#   /labs/         labs 01-09, plain HTML and JS with no build step
#   /editor/       the React and Material UI editor
#   /client/       the standalone client build
#
# Requires Settings -> Pages -> Source: "GitHub Actions" to be selected once.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a push is not
# silently dropped when several land together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have, and it catches the breakage
          # that actually happens: a stray byte, or syntax a target browser
          # will not parse.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs assets tools -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"

      - name: Check every lab loads its shared modules
        run: |
          # Each lab pulls the shared modules with plain <script> tags. A moved
          # or renamed module would only show up as a blank page in a browser,
          # so verify every referenced path actually exists.
          fail=0
          for html in labs/*/index.html; do
            dir=$(dirname "$html")
            grep -o 'src="[^"]*\.js"' "$html" | sed 's/src="//;s/"//' | while read -r src; do
              case "$src" in
                http*) continue ;;
              esac
              if [ ! -f "$dir/$src" ]; then
                echo "::error file=$html::missing script $src"
                exit 1
              fi
            done || fail=1
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all script references resolve"

      - name: Build the packages and stage the site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
