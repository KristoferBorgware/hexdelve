# Publish the site to GitHub Pages on every push to main.
#
# The site is three things served side by side, staged by tools/build-pages.js:
#
#   /              the landing page, generated from the labs themselves
#   /labs/         labs 01-09, plain HTML and JS with no build step
#   /editor/       the React and Material UI editor
#   /client/       the standalone client build
#
# Requires Settings -> Pages -> Source: "GitHub Actions" to be selected once.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a push is not
# silently dropped when several land together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The tarball cache, which is what saves the DOWNLOAD on the miss
          # path below. It does not save the install; that is the next step.
          cache: npm

      # The installed tree itself, which is the whole of the seven minutes.
      #
      # `npm ci` DELETES node_modules before it installs, so caching the tree
      # and then running `npm ci` anyway would throw the cache away every time.
      # The install has to be skipped on a hit, which is what the `if` below
      # does — and it is why `cache: npm` alone never helped: 424 packages and
      # 445 MB were being re-extracted on every run whether or not the download
      # was cached.
      #
      # Keyed on the lockfile, so any dependency change misses and reinstalls.
      - name: Restore the installed tree
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        # The flags are belt and braces over the repository's .npmrc, so that
        # this step says what it does rather than depending on a file two
        # directories up.
        #
        # `--no-audit` is the one that mattered. The audit POSTs the whole tree
        # and waits, and during a registry incident on 2026-09-04 that request
        # took 276 seconds against about 20ms for every other request in the
        # same install — the whole of the seven minutes this step used to take.
        # The outage passed; the reason not to depend on it did not. See the
        # repository's .npmrc, which turns the same thing off for everybody.
        #
        # `--ignore-scripts` is a smaller saving. The only install script that
        # runs on Linux is electron-winstaller's, which prepares a Windows
        # installer no job here builds; the other two are `fsevents`, which is
        # macOS-only. No package in this repository has a `prepare` or
        # `postinstall` of its own.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck every package
        run: npm run typecheck

      - name: Syntax-check the labs
        run: |
          # The labs are plain scripts with no build step, so parsing them is
          # the only automated check they have, and it catches the breakage
          # that actually happens: a stray byte, or syntax a target browser
          # will not parse.
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find labs tools public/assets/audio -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all scripts parsed"

      - name: Check every lab loads its shared modules
        run: |
          # Each lab pulls the shared modules with plain <script> tags. A moved
          # or renamed module would only show up as a blank page in a browser,
          # so verify every referenced path actually exists.
          fail=0
          for html in labs/*/index.html; do
            dir=$(dirname "$html")
            grep -o 'src="[^"]*\.js"' "$html" | sed 's/src="//;s/"//' | while read -r src; do
              case "$src" in
                http*) continue ;;
              esac
              if [ ! -f "$dir/$src" ]; then
                echo "::error file=$html::missing script $src"
                exit 1
              fi
            done || fail=1
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all script references resolve"

      - name: Build the packages and stage the site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
