# The things there is exactly one of.
#
# A wanderer is spawned when a wanderer is wanted, and there can be two. A
# register of characters cannot be either of those things — the whole of what
# makes it useful is that everything looking for a character looks in the same
# place. So it is a prefab instantiated once, when the client or the editor
# starts, and never again.
#
# It is otherwise an ordinary object with ordinary components on it, which is
# the point: a system script is written the same way a character's is, and the
# editor will show it the same way.

id: game
name: Game systems

object:
  name: systems
  components: []

  children:
    # Who is in the world. Everything that goes looking for a character looks
    # here, and a character puts itself in when it loads. It is a child rather
    # than a component on `systems` so that each system is one object with one
    # name, which is what the editor's tree will show.
    - name: characters
      components:
        - { type: script, script: CharacterRegistry }

    # The one place that knows what a swing hits. A swing is announced, this
    # works out what was in front of it, and whatever that was hears about it
    # as damage — so nothing that deals damage has to know what can take it.
    #
    # No parameters. The slack allowed on a swept arc is `arcPad`, and what the
    # script declares as its default is the value the game was tuned at — a
    # file that restated it would be the same number written twice.
    - name: combat
      components:
        - { type: script, script: Combat }

    # Whose turn it is. Everything that acts is read out of the scene, so a
    # third creature is an entity file and no line here — and the order the
    # scene holds them in is the tie-break, which is why the man is spawned
    # first rather than compared against.
    - name: turns
      components:
        - { type: script, script: Turns }
