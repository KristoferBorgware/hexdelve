# The small kobold.
#
# Angband's, at the top of the dungeon: a squat and ugly humanoid a metre
# tall with a canine face. Its own rig, because a body with a muzzle that
# opens, ears that flick and a tail that wags has three things the
# humanoid's seventeen bones have nowhere to put. Its gaits and its strike
# are clips baked from pose functions, since each foot is solved onto the
# ground.

id: kobold
name: Small kobold

object:
  components:
    - { type: rig, rig: ../rigs/kobold.rig.yaml }
    - { type: mesh, mesh: ../meshes/kobold.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/kobold-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/kobold-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        run: { clip: ../clips/kobold-run.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        stab: ../clips/kobold-stab.clip.yaml
      blendTrees:
        locomotion: ../trees/scurry.tree.yaml
    # What it is in a fight. The numbers are the character's, not the rig's, so
    # tuning a creature is editing this file rather than a script. The lift is
    # the middle of the chest: what a blade has to reach.
    - { type: script, script: Character, hp: 8, faction: foe, power: 2, lift: 0.6 }
