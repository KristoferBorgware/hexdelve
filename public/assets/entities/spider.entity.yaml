id: spider
name: Spider

object:
  components:
    - { type: rig, rig: ../rigs/spider.rig.yaml }
    - { type: mesh, mesh: ../meshes/spider.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/spider-idle.clip.yaml, contacts: [0.25, 0.75] }
        run: { clip: ../clips/spider-run.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        spit: ../clips/spider-spit.clip.yaml
      blendTrees:
        locomotion: ../trees/scuttle.tree.yaml
    - { type: script, script: Character, hp: 14, faction: foe, power: 4, lift: 0.4 }
