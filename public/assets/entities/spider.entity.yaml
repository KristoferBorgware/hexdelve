id: spider
name: Spider

object:
  components:
    - { type: rig, rig: ../rigs/spider.rig.yaml }
    - { type: mesh, mesh: ../meshes/spider.mesh.yaml }
    - type: animator
      animations:
        idle: { procedural: spiderRun, label: Idle, args: { amp: 0 }, duration: tau / 1.6 }
        run: { procedural: spiderRun, label: Run, args: { amp: 1 }, sync: true }
        spit: { procedural: spiderSpit, label: Spit }
      blendTrees:
        locomotion: ../trees/scuttle.tree.yaml
    - { type: script, script: Character, hp: 14, faction: foe, power: 4, lift: 0.4 }
