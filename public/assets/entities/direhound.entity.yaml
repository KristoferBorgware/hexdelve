id: direhound
name: Dire hellhound

object:
  components:
    - { type: rig, rig: ../rigs/direhound.rig.yaml }
    - { type: mesh, mesh: ../meshes/direhound.mesh.yaml }
    - type: animator
      animations:
        idle: { procedural: direRun, label: Idle, args: { amp: 0 }, duration: tau / 1.6 }
        run: { procedural: direRun, label: Run, args: { amp: 1 }, sync: true }
        bite: { procedural: direBite, label: Attack bite }
        rest: { procedural: direRest, label: Rest, duration: tau / 1.3 }
    - { type: script, script: Character, hp: 30, faction: foe, power: 7 }
