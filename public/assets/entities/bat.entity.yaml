id: bat
name: Bat

object:
  components:
    - { type: rig, rig: ../rigs/bat.rig.yaml }
    - { type: mesh, mesh: ../meshes/bat.mesh.yaml }
    - type: animator
      animations:
        fly: { clip: ../clips/bat-fly.clip.yaml, sync: true }
        hover: { clip: ../clips/bat-hover.clip.yaml, sync: true }
        thrash: { clip: ../clips/bat-thrash.clip.yaml, sync: true }
        perch: ../clips/bat-perch.clip.yaml
        lunge: ../clips/bat-lunge.clip.yaml
      blendTrees:
        flight: ../trees/flight.tree.yaml
    - { type: script, script: Hunter, wakeRange: 3, loseRange: 6, climb: 2 }
    - { type: script, script: Character, hp: 6, faction: foe, power: 2, lift: 0.72 }
