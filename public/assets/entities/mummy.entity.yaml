# The mummified human.
#
# Angband's: a human form encased in mouldy wrappings, from the middle of
# the dungeon. It wears the humanoid rig — a dried man is still a man — and
# none of the man's animations: its trudge, its grasp and its clout are its
# own, each a clip baked from a pose function, since each foot is solved
# onto the ground.

id: mummy
name: Mummified human

object:
  components:
    - { type: rig, rig: ../rigs/humanoid.rig.yaml }
    - { type: mesh, mesh: ../meshes/mummy.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/mummy-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/mummy-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        grasp: ../clips/mummy-grasp.clip.yaml
        clout: ../clips/mummy-clout.clip.yaml
      blendTrees:
        locomotion: ../trees/trudge.tree.yaml
    # What it is in a fight. The numbers are the character's, not the rig's, so
    # tuning a creature is editing this file rather than a script.
    - { type: script, script: Character, hp: 40, faction: foe, power: 7 }
