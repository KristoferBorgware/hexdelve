id: ghoul
name: Ghoul

view:
  focusY: 0.78

object:
  components:
    - { type: rig, rig: ../rigs/humanoid.rig.yaml }
    - { type: mesh, mesh: ../meshes/ghoul.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/ghoul-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/ghoul-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        run: { clip: ../clips/ghoul-run.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        leap: ../clips/leap.clip.yaml
      blendTrees:
        locomotion: ../trees/shamble.tree.yaml
    - { type: script, script: Character, hp: 14, faction: foe, power: 4 }
