id: ghoul
name: Ghoul

view:
  focusY: 0.78

object:
  components:
    - { type: rig, rig: ../rigs/humanoid.rig.yaml }
    - { type: mesh, mesh: ../meshes/ghoul.mesh.yaml }
    - type: animator
      animations:
        idle: { procedural: ghoulShamble, label: Idle, args: { amp: 0 }, duration: tau / 1.7 }
        walk: { procedural: ghoulShamble, label: Walk, args: { amp: 1 }, sync: true }
        run: { procedural: ghoulScramble, label: Run, args: { amp: 1 }, sync: true }
        leap: ../clips/leap.clip.yaml
      blendTrees:
        locomotion: ../trees/shamble.tree.yaml
    - { type: script, script: Character, hp: 14, faction: foe, power: 4 }
