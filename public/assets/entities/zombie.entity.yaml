id: zombie
name: Zombie

object:
  components:
    - { type: rig, rig: ../rigs/humanoid.rig.yaml }
    - { type: mesh, mesh: ../meshes/zombie.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/zombie-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/zombie-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        slash: ../clips/overhead.clip.yaml
      blendTrees:
        locomotion: ../trees/shuffle.tree.yaml
    - { type: script, script: Character, hp: 16, faction: foe, power: 5 }
