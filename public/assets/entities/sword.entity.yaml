# The sword.
#
# Modelled around the origin of the fist that holds it, so worn its transform
# is the identity. Put down it lies flat, which is the one number that
# separates it from the helmet.

id: sword
name: Sword
kind: prop
tags: [weapon]

mesh: ../meshes/sword.mesh.yaml

attach:
  rig: ../rigs/humanoid.rig.yaml
  bone: handR

ground:
  lift: 0.04
  tilt: pi / 2

# What it is when it is lying in the grass: one object, with the thing itself
# attached to it. The bone it hangs from and the two numbers above are read off
# this file rather than repeated here — there is no second place to say how a
# it lies.
object:
  components:
    - { type: item }
