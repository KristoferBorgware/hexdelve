id: wanderer
name: Wanderer

object:
  components:
    - { type: rig, rig: ../rigs/humanoid.rig.yaml }
    - { type: mesh, mesh: ../meshes/wanderer.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/wanderer-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/wanderer-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        run: { clip: ../clips/wanderer-run.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        guard: ../clips/guard.clip.yaml
        slash: ../clips/slash.clip.yaml
        duck: ../clips/duck.clip.yaml
        upright: ../clips/upright.clip.yaml
        leanLeft: ../clips/lean-left.clip.yaml
        leanRight: ../clips/lean-right.clip.yaml
      blendTrees:
        locomotion: ../trees/locomotion.tree.yaml
    - { type: footIK, sole: 0.08, reach: 0.18 }
    - { type: script, script: PlayerInput }
    - { type: script, script: Character, hp: 20, faction: player, power: 5 }
