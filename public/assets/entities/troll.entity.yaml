id: troll
name: Troll

object:
  components:
    - { type: rig, rig: ../rigs/troll.rig.yaml }
    - { type: mesh, mesh: ../meshes/troll.mesh.yaml }
    - type: animator
      animations:
        idle: { clip: ../clips/troll-idle.clip.yaml, contacts: [0.25, 0.75] }
        walk: { clip: ../clips/troll-walk.clip.yaml, sync: true, contacts: [0.25, 0.75] }
        smash: ../clips/troll-smash.clip.yaml
        swipe: ../clips/troll-swipe.clip.yaml
        poke: ../clips/troll-poke.clip.yaml
        rest: ../clips/troll-rest.clip.yaml
      blendTrees:
        locomotion: ../trees/stomp.tree.yaml
    - { type: script, script: Character, hp: 120, faction: foe, power: 18, lift: 2.1 }
