# The ghoul's locomotion tree: one axis, from the hunched stand through the
# shamble to the scramble on all fours.
#
# The plain case beside the humanoid's locomotion tree: a single blend1d over
# three leaves, because a ghoul has no guard or lean to lay over its gait.
# The thresholds on the axis are measured off each gait's own feet, as the
# wanderer's are, and the axis is calibrated the same way, so the slider is
# in true metres per second.
#
# It refers to its leaves by NAME, not by path. The entity file says what
# `walk` is.

id: shamble
label: Shamble tree
rig: ../rigs/humanoid.rig.yaml
fallbackCycle: walk

parameters:
  - name: speed
    label: Speed
    unit: m/s
    min: 0
    max: { speedOf: run }
    step: 0.01
    initial: { speedOf: walk }
    calibrated: true
    hint: Calibrated, so the number on the slider is the speed it delivers

root:
  blend1d:
    param: speed
    label: speed, m/s
    entries:
      - { at: 0, node: { leaf: idle } }
      - { at: { speedOf: walk }, node: { leaf: walk } }
      - { at: { speedOf: run }, node: { leaf: run } }
