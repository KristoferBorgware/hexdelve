# A cut, not a thrust, and an inside-out one.
#
# The difference between a cut and a poke is where the blade travels, and that
# is decided by the shoulder and the roll of the wrist — not by how fast the
# arm moves. Poking is what happens when the arm extends along the line the
# blade already points down, so here the arm never extends that way: the sword
# is drawn across the body first, inside the shield, and the strike sweeps it
# back out to the right, edge leading, finishing wide. The point is not aimed
# at anything at any moment.
#
# The rest of the body has to come with it or it reads as a man waving:
#   hips and spine turn first, and the arm is dragged round by them
#   the shield arm is thrown BACK through the strike — both the counterweight
#   and the reason the shoulders can come round that fast
#   the elbow extends through contact, which puts the speed at the tip rather
#   than at the fist

id: slash
name: Slash
rig: ../rigs/humanoid.rig.yaml
duration: 1.15
loop: hold

events:
  - { t: 0.44, name: cut }

poses:
  # Out of guard.
  - t: 0
    bones:
      root: { rot: [0, -0.26, 0], pos: [0, -0.015, 0] }
      spine: [0.06, -0.1, 0.03]
      chest: [0.05, -0.2, 0.05]
      neck: [0.02, 0.14, 0]
      head: [0.02, 0.2, 0]
      armL: [-0.85, -1.0, 0.32]
      forearmL: [-1.45, -0.3, 0]
      armR: [0.25, 0, -0.42]
      forearmR: [-2.0, 0, 0]
      handR: [-1.0, -0.35, 0]
      hipL: [-0.3091, -0.1, 0.07]
      hipR: [-0.2916, -0.1, -0.07]
      shinL: [0.6418, 0, 0]
      shinR: [0.6388, 0, 0]
      footL: [-0.3427, 0.1, 0]
      footR: [-0.3372, 0.1, 0]

  # Cocked, and cocked INSIDE: hips and shoulders wind to his left and the
  # sword comes across the chest behind the shield, elbow folded, edge already
  # turned outward. Everything after this is that unwinding.
  - t: 0.3
    ease: flat
    bones:
      root: { rot: [0, 0.42, 0], pos: [-0.03, -0.025, -0.04] }
      spine: [0.02, 0.28, -0.08]
      chest: [-0.04, 0.5, -0.12]
      # The head does not wind up with the body; it stays on the target, which
      # is what makes the shoulders read as loaded rather than as the whole man
      # turning round.
      neck: [0.02, -0.24, 0]
      head: [0.02, -0.34, 0]
      armL: [-0.95, -1.0, 0.4]
      forearmL: [-1.5, -0.3, 0]
      armR: [-0.45, 0, 0.95]
      forearmR: [-1.75, 0, 0]
      # The wrist is loaded here and unloads through contact, which is where
      # the last of the tip speed comes from.
      handR: [-0.8, 0.7, 0]
      hipL: [-0.2474, 0.24, 0.07]
      hipR: [-0.336, 0.24, -0.07]
      shinL: [0.6398, 0, 0]
      shinR: [0.6517, 0, 0]
      footL: [-0.3423, -0.2, 0]
      footR: [-0.3356, -0.2, 0]

  # Contact. Hips, spine and chest have all whipped the other way — near ninety
  # degrees of shoulder between this and the key before it, which is where the
  # force comes from — and the sword sweeps out to his right with the elbow
  # extending through it. This is the frame the reach and the bearing are
  # measured from: the blade is out to the SIDE here, not out in front, and the
  # hit test asks the pose rather than assuming.
  - t: 0.44
    bones:
      root: { rot: [0, -0.32, 0], pos: [0.04, -0.05, 0.06] }
      spine: [0.12, -0.3, 0.06]
      chest: [0.14, -0.58, 0.1]
      neck: [0, 0.24, 0]
      # The head stays level and on the target the whole way through.
      head: [0.02, 0.38, 0]
      # Thrown back and open: the counterweight, and the only reason the
      # shoulders can come round this fast. The elbow has to STRAIGHTEN for
      # that — swinging the upper arm back with the elbow still bent just folds
      # the shield across his own face.
      armL: [0.9, -0.5, 0.3]
      forearmL: [-0.15, 0, 0]
      armR: [-0.6, 0, -0.85]
      forearmR: [-0.28, 0, 0]
      handR: [-0.25, 0.2, 0]
      hipL: [-0.376, -0.26, 0.07]
      hipR: [-0.2174, -0.26, -0.07]
      shinL: [0.6517, 0, 0]
      shinR: [0.6398, 0, 0]
      footL: [-0.3356, 0.2, 0]
      footR: [-0.3423, 0.2, 0]

  # Follow-through: wide and low on his right, which is where an inside-out cut
  # ends up if nothing stopped it.
  - t: 0.6
    bones:
      root: { rot: [0, -0.45, 0], pos: [0.03, -0.06, 0.03] }
      spine: [0.16, -0.38, 0.09]
      chest: [0.18, -0.72, 0.14]
      neck: [0, 0.28, 0]
      head: [0.04, 0.42, 0]
      armL: [0.7, -0.55, 0.28]
      forearmL: [-0.35, 0, 0]
      armR: [-0.35, 0, -1.3]
      forearmR: [-0.55, 0, 0]
      handR: [0.1, -0.05, 0]
      hipL: [-0.16, -0.34, 0.07]
      hipR: [0.06, -0.34, -0.07]

  # And back to guard, slower than he struck.
  - t: 1.15
    bones:
      root: { rot: [0, -0.26, 0], pos: [0, -0.015, 0] }
      spine: [0.06, -0.1, 0.03]
      chest: [0.05, -0.2, 0.05]
      neck: [0.02, 0.14, 0]
      head: [0.02, 0.2, 0]
      armL: [-0.85, -1.0, 0.32]
      forearmL: [-1.45, -0.3, 0]
      armR: [0.25, 0, -0.42]
      forearmR: [-2.0, 0, 0]
      handR: [-1.0, -0.35, 0]
      hipL: [-0.3091, -0.1, 0.07]
      hipR: [-0.2916, -0.1, -0.07]
      shinL: [0.6418, 0, 0]
      shinR: [0.6388, 0, 0]
      footL: [-0.3427, 0.1, 0]
      footR: [-0.3372, 0.1, 0]
