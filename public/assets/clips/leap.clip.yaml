# The ghoul's leap: a pounce with the claws, from its own hexagon into the
# next one and back.
#
# Seven keys. It coils — the crouch it already stands in dropping lower, the
# arms drawn back behind it — holds a beat, and springs: the legs snap
# straight and trail behind, the arms come forward and up, and the whole
# animal is in the air and half a hexagon forward. It lands on all fours in
# the crouch the scramble runs in, the claws going into the target as the
# hands hit the ground, drags them back through it, and hops back to its
# own cell, which is where the clip leaves it.
#
# The forward drive in the root's `pos` is what carries the strike across the
# gap: neighbouring hexagon centres are 1.73 m apart, so a leap that only
# leaned would land on nothing. It is a metre of travel inside the pose — a
# jump and a scramble back — rather than the creature being moved, so it
# strikes and is still exactly where the grid says it is.
#
# The leg angles at every key with a foot on the ground were solved against
# the rig so the soles sit on it: at the crouches the knees are folded to
# nearly two radians and the ankles cancel the fold, which is what keeps a
# hunched creature from standing on its toes. The landing is the scramble's
# own crouch, hands and feet solved onto the ground the same way, with the
# palms turned down by a quarter turn at the wrist. An arm hangs in the chest's
# frame, and the chest is pitched forward by the whole bend of the spine, so
# every arm key below is the bend taken back out at the shoulder plus where
# the arm is meant to point: -1.55 at the stand hangs it a little forward of
# straight down under a bend of one and a quarter radians. The hands turn in
# at the wrist, palms towards each other, and further in as the claws come
# down on the target.

id: leap
name: Leap attack
rig: ../rigs/humanoid.rig.yaml
duration: 1.15
loop: hold

events:
  - { t: 0.55, name: strike }

poses:
  # The hunched stand it starts from: the same crouch the shamble holds.
  - t: 0
    bones:
      root: { rot: [0.25, 0, 0], pos: [0, -0.22, 0] }
      spine: [0.55, 0, 0]
      chest: [0.45, 0, 0]
      neck: [-0.45, 0, 0.14]
      head: [-0.5, 0, 0.05]
      armL: [-1.55, 0.05, 0.28]
      armR: [-1.61, -0.05, -0.24]
      forearmL: [-0.5, 0.1, 0.05]
      forearmR: [-0.6, -0.1, -0.05]
      handL: [-0.4, -0.35, 0.1]
      handR: [-0.45, 0.35, -0.1]
      hipL: [-1.0, 0, 0.1]
      shinL: [1.43, 0, 0]
      footL: [-0.68, 0.18, -0.08]
      hipR: [-0.83, 0, -0.1]
      shinR: [1.44, 0, 0]
      footR: [-0.86, -0.18, 0.08]

  # Coiled: lower still, weight back, arms drawn back and up behind the
  # shoulders with the claws cocked, the face turned up at the target. Held
  # flat so the spring reads as a release rather than a swing.
  - t: 0.3
    ease: flat
    bones:
      root: { rot: [0.32, 0, 0], pos: [0, -0.36, -0.12] }
      spine: [0.75, 0, 0]
      chest: [0.35, 0, 0]
      neck: [-0.55, 0, 0.1]
      head: [-0.55, 0, 0]
      armL: [0.18, 0.2, 0.55]
      armR: [0.22, -0.2, -0.5]
      forearmL: [-1.3, 0, 0]
      forearmR: [-1.3, 0, 0]
      handL: [-0.6, -0.3, 0.2]
      handR: [-0.6, 0.3, -0.2]
      hipL: [-1.45, 0, 0.1]
      shinL: [1.88, 0, 0]
      footL: [-0.75, 0.18, -0.08]
      hipR: [-1.16, 0, -0.1]
      shinR: [1.94, 0, 0]
      footR: [-1.1, -0.18, 0.08]

  # Sprung: in the air, pitched forward, legs straight out behind with the
  # toes pointed, arms thrown up and over with the claws leading.
  - t: 0.45
    bones:
      root: { rot: [0.45, 0, 0], pos: [0, 0.22, 0.5] }
      spine: [0.35, 0, 0]
      chest: [0.25, 0, 0]
      neck: [-0.4, 0, 0.05]
      head: [-0.35, 0, 0]
      armL: [-3.05, 0.1, 0.7]
      armR: [-3.1, -0.1, -0.65]
      forearmL: [-0.5, 0, 0]
      forearmR: [-0.5, 0, 0]
      handL: [-0.6, -0.5, 0.3]
      handR: [-0.6, 0.5, -0.3]
      hipL: [0.6, 0, 0.12]
      shinL: [0.7, 0, 0]
      footL: [0.6, 0.1, 0]
      hipR: [0.75, 0, -0.12]
      shinR: [0.6, 0, 0]
      footR: [0.7, -0.1, 0]

  # The strike: it lands a metre forward on all fours, in the crouch the
  # scramble runs in, the claws going into the target as the hands hit the
  # ground. This is the frame a reach is measured from.
  - t: 0.55
    bones:
      root: { rot: [0.55, 0, 0], pos: [0, -0.56, 0.95] }
      spine: [0.5, 0, 0]
      chest: [0.35, 0, 0]
      neck: [-0.65, 0, 0.1]
      head: [-0.6, 0, 0.04]
      armL: [-1.08, 0, 0.15]
      armR: [-1.08, 0, -0.15]
      forearmL: [-0.98, 0, 0]
      forearmR: [-0.98, 0, 0]
      handL: [-0.91, -1.57, 0]
      handR: [-0.91, 1.57, 0]
      hipL: [-1.57, 0, 0.3]
      shinL: [2.53, 0, 0]
      footL: [-1.51, 0.18, -0.08]
      hipR: [-1.57, 0, -0.3]
      shinR: [2.53, 0, 0]
      footR: [-1.51, -0.18, 0.08]

  # Raked through: still on all fours, the body sinks and the hands drag
  # back through the target towards the chest, the head down after them.
  - t: 0.72
    bones:
      root: { rot: [0.6, 0, 0], pos: [0, -0.59, 0.9] }
      spine: [0.55, 0, 0]
      chest: [0.35, 0, 0]
      neck: [-0.45, 0, 0.1]
      head: [-0.35, 0, 0.04]
      armL: [-0.68, 0, 0.15]
      armR: [-0.68, 0, -0.15]
      forearmL: [-1.33, 0, 0]
      forearmR: [-1.33, 0, 0]
      handL: [-1.05, -1.57, 0]
      handR: [-1.05, 1.57, 0]
      hipL: [-1.64, 0, 0.3]
      shinL: [2.61, 0, 0]
      footL: [-1.58, 0.18, -0.08]
      hipR: [-1.64, 0, -0.3]
      shinR: [2.61, 0, 0]
      footR: [-1.58, -0.18, 0.08]

  # Halfway back: a hop, off the ground with the legs tucked under it, so
  # the return to its own cell is a scramble rather than a slide.
  - t: 0.92
    bones:
      root: { rot: [0.3, 0, 0], pos: [0, -0.04, 0.42] }
      spine: [0.7, 0, 0]
      chest: [0.4, 0, 0]
      neck: [-0.5, 0, 0.1]
      head: [-0.45, 0, 0.05]
      armL: [-1.2, 0.1, 0.4]
      armR: [-1.25, -0.1, -0.35]
      forearmL: [-0.6, 0, 0]
      forearmR: [-0.6, 0, 0]
      handL: [-0.4, -0.35, 0.2]
      handR: [-0.4, 0.35, -0.2]
      hipL: [-1.3, 0, 0.12]
      shinL: [1.9, 0, 0]
      footL: [-0.2, 0.18, -0.08]
      hipR: [-1.2, 0, -0.12]
      shinR: [1.8, 0, 0]
      footR: [-0.3, -0.18, 0.08]

  # And down in its own cell, into the stand it started from.
  - t: 1.15
    bones:
      root: { rot: [0.25, 0, 0], pos: [0, -0.22, 0] }
      spine: [0.55, 0, 0]
      chest: [0.45, 0, 0]
      neck: [-0.45, 0, 0.14]
      head: [-0.5, 0, 0.05]
      armL: [-1.55, 0.05, 0.28]
      armR: [-1.61, -0.05, -0.24]
      forearmL: [-0.5, 0.1, 0.05]
      forearmR: [-0.6, -0.1, -0.05]
      handL: [-0.4, -0.35, 0.1]
      handR: [-0.45, 0.35, -0.1]
      hipL: [-1.0, 0, 0.1]
      shinL: [1.43, 0, 0]
      footL: [-0.68, 0.18, -0.08]
      hipR: [-0.83, 0, -0.1]
      shinR: [1.44, 0, 0]
      footR: [-0.86, -0.18, 0.08]
