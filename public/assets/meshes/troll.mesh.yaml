# The troll: hexagonal prisms hung on its own rig.
#
# Built the way every other body in this project is — the unit hex prism
# under a different scale and rotation, bound to a bone — and most of it is
# torso and arm. The limbs are struts spanning their own bones by naming them,
# so re-proportioning a bone in the rig moves the strut with it, with the
# muscle laid over each strut as prisms: a biceps and a triceps on the upper
# arm, a quad and a hamstring on the thigh, a calf on the shin. The joints are
# knobs. The hands are not mirrored, because they are not the same hand: the
# right is a fist closed round where the club's handle will be, the left hangs
# open with the fingers spread.
#
# The skin is blue-grey stone over a paler ochre underside, warted and
# scarred; the tusks stand up out of the lower jaw past the upper lip; the
# eyes are small and deep under the brow and drawn unlit, so they read from
# every angle. A hide loincloth on a rope belt, a wrap on each wrist and
# ankle, a bone through the nose, a skull on the belt.

