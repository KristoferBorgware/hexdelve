# The second wanderer: hexagonal prisms on the humanoid rig.
#
# Every part is the unit hex prism under a different scale and rotation, bound
# to a bone, and nothing here is animated directly — posing the rig poses the
# character. The rig is the wanderer's and so are the animations, the clips
# and the tree; only the body is this file's.
#
# He is built as a fighter: broad through the shoulders and bare-armed, with
# the muscle laid over each limb and the chest as its own prisms, a wrap of
# cloth over the right shoulder and across the chest to the left hip, a wide
# belt with a buckle and a strap hanging off it, dark trousers into strapped
# boots, and dark leather cuffs at the wrists. Nothing hangs off the pelvis
# below the belt, so the legs are never inside cloth and every clip reads on
# him unchanged. A full grey beard and grey hair swept back, on a heavy brow.
#
# The helmet, sword and shield attach to bones, not to this body, so they sit
# on him where they sit on the wanderer: the head is the same size and the
# hands and forearms are close enough that a hilt and a strap still fit.

