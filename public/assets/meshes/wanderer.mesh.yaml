# The player character: hexagonal prisms on the humanoid rig.
#
# Every part is the unit hex prism under a different scale and rotation, bound
# to a bone, and nothing here is animated directly — posing the rig poses the
# character.
#
# He carries nothing at all, so both hands stay free and every clip reads on
# him unchanged. What he wears instead is close-cut layered cloth — a wrapped
# chest, a short tunic over trousers, wound wrists and laced greaves — with
# nothing hanging off the pelvis, so the legs are never fighting a garment and
# there is no cloth to drive.

id: wanderer
name: Wanderer body
rig: ../rigs/humanoid.rig.yaml

palette:
  skin: 0xcf9b76
  hair: 0x8b837a
  beard: 0x43392f
  tunic: 0xcec5b4
  fold: 0xbcb2a0
  wrap: 0xb6ab98
  belt: 0x6d4a2e
  pouch: 0x593c25
  buckle: 0x7c7a72
  hem: 0xd8cfbd
  hemShade: 0xb0a693
  trouser: 0x3c362f
  greave: 0x7d4f30
  greaveDark: 0x5e3a23
  boot: 0x6b4227

parts:
  # Pelvis: trousers, belt, and the pouch slung off it.
  - { bone: root, at: [0, -0.03, 0], size: [0.24, 0.24, 0.175], color: trouser }
  - { bone: root, at: [0, 0.08, 0.01], size: [0.26, 0.09, 0.19], color: tunic }
  - { bone: root, at: [0, 0.02, 0.01], size: [0.27, 0.07, 0.2], color: belt }
  - { bone: root, at: [0, 0.02, 0.19], size: [0.045, 0.05, 0.03], color: buckle }
  - { bone: root, at: [0.16, -0.06, 0.09], size: [0.07, 0.13, 0.05], color: pouch }

  # The tunic's hem, a course wider than the belt: the whole garment stops at
  # the hip, so the legs are never inside cloth and nothing has to be swung out
  # of their way as he walks.
  - { bone: root, at: [0, -0.14, 0.005], size: [0.275, 0.12, 0.25], color: hem }
  - { bone: root, at: [0, -0.215, 0.005], size: [0.262, 0.045, 0.238], color: hemShade }

  # Torso: tunic, a fold of cloth over the left shoulder, and the wrapping.
  # Each band of cloth is tipped off horizontal so the wrap reads as a spiral
  # rather than as a stack of hoops.
  - { bone: spine, at: [0, 0.02, 0], size: [0.23, 0.2, 0.165], color: tunic }
  - { bone: chest, at: [0, 0.03, 0], size: [0.265, 0.32, 0.185], color: tunic }
  - { bone: chest, at: [0, 0.17, 0], size: [0.28, 0.1, 0.195], color: fold }
  - { bone: chest, at: [0.13, 0.13, 0.01], size: [0.12, 0.11, 0.16], color: fold }
  - { bone: chest, at: [0, 0.08, 0.005], size: [0.272, 0.035, 0.19], euler: [0, 0, 0.05], color: wrap }
  - { bone: chest, at: [0, 0.005, 0.005], size: [0.274, 0.04, 0.192], euler: [0, 0, -0.06], color: wrap }
  - { bone: chest, at: [0, -0.075, 0.005], size: [0.272, 0.035, 0.19], euler: [0, 0, 0.06], color: wrap }
  - { bone: spine, at: [0, -0.055, 0.005], size: [0.245, 0.035, 0.175], euler: [0, 0, -0.05], color: wrap }

  # Neck and head: grey hair swept back, a full beard, no cap.
  - { bone: neck, at: [0, 0.02, 0], size: [0.085, 0.14, 0.085], color: skin }
  - { bone: head, at: [0, 0.02, 0], size: [0.18, 0.23, 0.165], color: skin }
  - { bone: head, at: [0, -0.08, 0.08], size: [0.145, 0.17, 0.105], color: beard }
  - { bone: head, at: [0, -0.155, 0.05], size: [0.09, 0.06, 0.07], color: beard }
  - { bone: head, at: [0, 0.02, 0.165], size: [0.032, 0.05, 0.032], color: skin }
  - { bone: head, at: [0, -0.035, 0.14], size: [0.055, 0.03, 0.05], color: beard }
  - { bone: head, at: [0.062, 0.055, 0.15], size: [0.023, 0.028, 0.012], color: beard }
  - { bone: head, at: [-0.062, 0.055, 0.15], size: [0.023, 0.028, 0.012], color: beard }
  - { bone: head, at: [0, 0.155, -0.01], size: [0.185, 0.08, 0.172], color: hair }
  - { bone: head, at: [0, 0.055, -0.105], size: [0.14, 0.16, 0.075], color: hair }
  - { bone: head, at: [0, 0.128, 0.145], size: [0.07, 0.04, 0.07], color: hair }
  - { bone: head, at: [0.088, 0.0, 0.05], size: [0.028, 0.09, 0.05], color: beard }
  - { bone: head, at: [-0.088, 0.0, 0.05], size: [0.028, 0.09, 0.05], color: beard }

  # Arms: a short sleeve, bare arm below it, wound wrist, open hand. Nothing is
  # held — the right fist is as free as the left.
  - sides: [L, R]
    parts:
      - { bone: 'arm*', at: [0, -0.01, 0], size: [0.1, 0.13, 0.1], color: tunic }
      - { bone: 'arm*', at: [0, -0.12, 0], size: [0.088, 0.2, 0.088], color: tunic }
      - { bone: 'arm*', at: [0, -0.27, 0], size: [0.072, 0.16, 0.072], color: skin }
      - { bone: 'forearm*', at: [0, -0.12, 0], size: [0.066, 0.22, 0.066], color: skin }
      - { bone: 'forearm*', at: [0, -0.235, 0], size: [0.076, 0.11, 0.076], color: wrap }
      - { bone: 'hand*', at: [0, -0.05, 0.01], size: [0.068, 0.12, 0.055], color: skin }

  # Legs: trousers into laced leather greaves and a boot. The three greave
  # courses widen and alternate their tilt going down, which is what reads as
  # lacing rather than as a stack of rings.
  - sides: [L, R]
    parts:
      - { bone: 'hip*', at: [0, -0.224, 0], size: [0.1, 0.404, 0.1], color: trouser }
      - { bone: 'shin*', at: [0, -0.126, 0], size: [0.088, 0.251, 0.088], color: trouser }
      - { bone: 'shin*', at: [0, -0.206, 0], size: [0.096, 0.086, 0.096], euler: [0, deg(-8), 0], color: greave }
      - { bone: 'shin*', at: [0, -0.286, 0], size: [0.102, 0.086, 0.102], euler: [0, deg(12), 0], color: greaveDark }
      - { bone: 'shin*', at: [0, -0.366, 0], size: [0.108, 0.086, 0.108], euler: [0, deg(-8), 0], color: greave }
      - { bone: 'foot*', at: [0, -0.06, 0.01], size: [0.096, 0.1, 0.106], color: boot }
      - { bone: 'foot*', at: [0, -0.075, 0.12], size: [0.082, 0.07, 0.086], color: greaveDark }
