# The hill giant: hexagonal prisms hung on its own rig.
#
# Built the way every other body in this project is — the unit hex prism
# under a different scale and rotation, bound to a bone — and built like a
# man, a very big one: a gut, a barrel chest, a heavy brow and a beard. The
# limbs are struts spanning their own bones by naming them, so re-proportioning
# a bone in the rig moves the strut with it, with the muscle laid over each
# strut as prisms: a biceps and a triceps on the upper arm, a quad and a
# hamstring on the thigh, a calf on the shin. The joints are knobs. The hands
# are one hand mirrored, a loose fist either side with the palm in and the
# back of the hand out, as a hanging hand's is.
#
# The skin is the umber Angband draws it in, ruddy and weathered, paler down
# the belly and darker over the back, and hairy: a mat on the chest, tufts
# down the arms and shins, a shaggy mop with a leather band round it, and a
# matted beard on the jaw, so it moves with the mouth. It wears what it has
# taken off what it has eaten — a kilt of stitched hides on a broad belt with
# a bronze buckle, a bear's pelt over the left shoulder with the paw still on
# it, hide wraps on the shins, a studded bracer on the right forearm, an iron
# band on the right arm and a ring in the right ear, a pouch, a coil of rope
# and a ram's skull on the belt.

