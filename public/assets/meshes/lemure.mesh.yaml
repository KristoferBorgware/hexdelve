      - { bone: 'foot*', at: [0, -0.03, -0.05], size: [0.06, 0.05, 0.04], color: fleshDark }
      - { bone: 'foot*', at: [-0.05, -0.04, 0.15], size: [0.025, 0.03, 0.035], color: flesh }
      - { bone: 'foot*', at: [0, -0.04, 0.16], size: [0.025, 0.03, 0.035], color: flesh }
