# The lemure: hexagonal prisms hung on its own rig.
#
# Built the way every other body in this project is — the unit hex prism
# under a different scale and rotation, bound to a bone — and most of it is
# sag. A lemure is the larval form of a demon, a body still cooling into
# shape: the head sits in the chest with no neck, the arms are short and the
# legs shorter, and between them hangs the sac, on a bone of its own so it
# can heave. The limbs are struts spanning their own bones by naming them,
# with a roll of flesh at every joint, and the skin runs in drips — struts
# hung off the pelvis, the sac, the jaw and the face, each with a drop on
# the end.
#
# The flesh is slate, the colour Angband gives it, over a paler underside,
# with the raw red showing at the mouth and in the sores, and the cracks in
# it drawn unlit in ember, so the fire it is cooling from reads from every
# angle. The eyes are unlit too, and not a pair: one bigger and higher than
# the other, in a face that has not settled.

id: lemure
name: Lemure body
rig: ../rigs/lemure.rig.yaml

palette:
  flesh: 0x777180
  fleshDark: 0x545060
  fleshLight: 0x948e9a
  raw: 0x8a4b52
  rawDark: 0x5c2f36
  ember: 0xff7a2a
  emberDark: 0xc8481e
  eye: 0xffb050
  mouth: 0x241318
  tooth: 0xd6ccae
  claw: 0x2c272b
  horn: 0x3b3438
  drip: 0x5c565f

