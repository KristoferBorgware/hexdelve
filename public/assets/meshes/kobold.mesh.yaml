      - { bone: 'foot*', from: [-0.02, -0.04, 0.1], along: [-0.2, -0.3, 1], length: 0.025, radius: 0.005, color: claw }
      - { bone: 'foot*', from: [0, -0.04, 0.105], along: [0, -0.3, 1], length: 0.027, radius: 0.005, color: claw }
      - { bone: 'foot*', from: [0.02, -0.04, 0.1], along: [0.2, -0.3, 1], length: 0.025, radius: 0.005, color: claw }

  # The tail: thin, in two bones, darker than the hide, with a tuft on the
  # end.
  - { bone: tail, at: [0, 0, -0.01], size: [0.02, 0.025, 0.02], color: hide }
  - { bone: tail, from: [0, 0, 0], to: { bone: tailTip }, radius: 0.014, color: hideDark }
  - { bone: tailTip, from: [0, 0, 0], along: [0, -0.2, -1], length: 0.1, radius: 0.01, color: hideDark }
  - { bone: tailTip, at: [0, -0.02, -0.1], size: [0.014, 0.016, 0.014], color: scruff }
