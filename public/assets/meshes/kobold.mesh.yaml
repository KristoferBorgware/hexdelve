      - { bone: chest, from: [0.02, 0.1, -0.095], along: [0.2, 0.5, -1], length: 0.04, radius: 0.006, color: scruff }

  # The neck: short and thick, the scruff standing up the back of it.
  - { bone: neck, at: [0, 0.03, 0.01], size: [0.04, 0.08, 0.04], color: hide }
  - { bone: neck, from: [0, 0.02, -0.04], along: [0, 0.4, -1], length: 0.04, radius: 0.007, color: scruff }
  - { bone: neck, from: [0, 0.06, -0.04], along: [0, 0.6, -1], length: 0.04, radius: 0.007, color: scruff }

  # The head: a dog's, on a humanoid. A low skull with a brow over two small
