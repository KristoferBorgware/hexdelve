      - { bone: 'hip*', at: [0, -0.1, 0.015], size: [0.03, 0.1, 0.028], color: hideLight }
      - { bone: 'shin*', at: [0, 0, 0.012], size: [0.034, 0.035, 0.034], color: hideDark }
