  # along the top and the nose black on the end of it, the upper lip and the
  # fangs under it, a cheek either side, a crest of scruff swept back over
  # the crown, a notch out of the brow, and warts.
  - { bone: head, at: [0, 0.04, -0.01], size: [0.08, 0.1, 0.085], color: hide }
  - { bone: head, at: [0, 0.075, 0.06], size: [0.075, 0.02, 0.03], color: hideDark }
  - { bone: head, at: [0, 0.01, 0.09], size: [0.045, 0.045, 0.07], color: muzzle }
  - { bone: head, at: [0, 0.035, 0.1], size: [0.03, 0.015, 0.05], color: hide }
  - { bone: head, at: [0, 0.03, 0.165], size: [0.02, 0.018, 0.015], color: nose }
  - { bone: head, at: [0.008, 0.02, 0.172], size: [0.004, 0.006, 0.004], color: mouth }
  - { bone: head, at: [-0.008, 0.02, 0.172], size: [0.004, 0.006, 0.004], color: mouth }
  - { bone: head, at: [0, -0.01, 0.12], size: [0.04, 0.008, 0.06], color: mouth }
  - { bone: head, at: [0, -0.014, 0.15], size: [0.03, 0.006, 0.02], color: gum }
  - { bone: head, at: [0.012, -0.02, 0.16], size: [0.005, 0.012, 0.005], color: tooth }
  - { bone: head, at: [-0.012, -0.02, 0.16], size: [0.005, 0.012, 0.005], color: tooth }
  - { bone: head, at: [0, -0.02, 0.163], size: [0.004, 0.01, 0.004], color: tooth }
  - { bone: head, at: [0.03, 0.09, 0.055], size: [0.005, 0.03, 0.006], euler: [0, 0, 0.3], color: hideDark }
  - { bone: head, at: [-0.05, 0.06, 0.05], size: [0.008, 0.008, 0.008], color: wart }
  - { bone: head, at: [0.04, 0.0, 0.11], size: [0.006, 0.006, 0.006], color: wart }
  - { bone: head, from: [0, 0.088, -0.01], along: [0, 0.7, -1], length: 0.04, radius: 0.006, color: scruff }
  - { bone: head, from: [0.015, 0.086, -0.02], along: [0.15, 0.6, -1], length: 0.035, radius: 0.005, color: scruff }
  - { bone: head, from: [-0.015, 0.086, -0.02], along: [-0.15, 0.6, -1], length: 0.035, radius: 0.005, color: scruff }
  - { bone: head, from: [0, 0.085, -0.04], along: [0, 0.4, -1], length: 0.035, radius: 0.006, color: scruff }
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: head, at: [0.035, 0.055, 0.07], size: [0.02, 0.018, 0.008], color: mouth }
      - { bone: head, at: [0.035, 0.055, 0.076], size: [0.013, 0.011, 0.008], color: eye, unlit: true }
