      - { bone: 'hand*', from: [-0.021, -0.098, 0.019], along: [-0.15, -1, 0.6], length: 0.025, radius: 0.005, color: claw }
      - { bone: 'hand*', from: [0, -0.06, 0.008], along: [0, -1, 0.3], length: 0.045, radius: 0.007, color: hide }
      - { bone: 'hand*', from: [0, -0.103, 0.021], along: [0, -1, 0.6], length: 0.027, radius: 0.005, color: claw }
      - { bone: 'hand*', from: [0.015, -0.06, 0.008], along: [0.15, -1, 0.3], length: 0.04, radius: 0.007, color: hide }
      - { bone: 'hand*', from: [0.021, -0.098, 0.019], along: [0.15, -1, 0.6], length: 0.025, radius: 0.005, color: claw }
      - { bone: 'hand*', from: [0.02, -0.03, 0.01], along: [0.6, -0.7, 0.4], length: 0.025, radius: 0.006, color: claw }

  # The knife, in the right fist only: a stick bound with cord for a handle,
  # running down through the fingers along the forearm, and a flake of flint
  # lashed to the end of it, flat, with its edge paler and its point ahead
