  - { bone: chest, at: [-0.06, 0.1, 0.07], size: [0.01, 0.01, 0.01], color: wart }
  - { bone: chest, from: [-0.065, 0.13, 0.07], to: [0.065, 0.13, 0.07], radius: 0.005, color: rope }
  - { bone: chest, at: [0, 0.11, 0.09], size: [0.006, 0.025, 0.006], euler: [0.1, 0, 0], color: tooth }
  - { bone: chest, at: [0.025, 0.115, 0.085], size: [0.006, 0.02, 0.006], euler: [0.1, 0, 0.15], color: tooth }
  - { bone: chest, at: [-0.025, 0.115, 0.085], size: [0.006, 0.02, 0.006], euler: [0.1, 0, -0.15], color: tooth }
  - { bone: chest, from: [0, 0.02, -0.1], along: [0, 0.4, -1], length: 0.045, radius: 0.007, color: scruff }
  - { bone: chest, from: [0, 0.07, -0.1], along: [0, 0.5, -1], length: 0.05, radius: 0.007, color: scruff }
  - { bone: chest, from: [0, 0.12, -0.095], along: [0, 0.6, -1], length: 0.05, radius: 0.007, color: scruff }
  - sides: [L, R]
    mirror: true
    parts:
