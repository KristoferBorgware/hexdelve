  - { bone: handR, from: [0, -0.02, 0.015], to: [0, -0.09, 0.015], radius: 0.007, color: wood }
  - { bone: handR, at: [0, -0.05, 0.015], size: [0.009, 0.02, 0.009], color: rope }
  - { bone: handR, at: [0, -0.095, 0.015], size: [0.009, 0.014, 0.009], color: rope }
  - { bone: handR, at: [0, -0.165, 0.015], size: [0.004, 0.14, 0.018], color: flint }
  - { bone: handR, at: [0, -0.16, 0.03], size: [0.003, 0.13, 0.006], color: flintEdge }
  - { bone: handR, at: [0, -0.245, 0.015], size: [0.003, 0.03, 0.008], color: flint }

  # The legs: short and bandy, the hip capped, the thigh as a strut with the
  # muscle over it, the knee, the shin with a wrap of rag round it, and a
  # broad flat foot — a pad, a heel, three toes and their claws.
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: 'hip*', at: [0, -0.01, 0], size: [0.04, 0.05, 0.04], color: hide }
