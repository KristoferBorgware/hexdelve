      - { bone: 'foot*', at: [0, -0.025, 0.035], size: [0.035, 0.04, 0.06], color: hide }
      - { bone: 'foot*', at: [0, -0.02, -0.02], size: [0.028, 0.035, 0.02], color: hideDark }
