# The small kobold: hexagonal prisms hung on its own rig.
#
# Built the way every other body in this project is — the unit hex prism
# under a different scale and rotation, bound to a bone — and small: a squat,
# ugly humanoid a metre tall with a canine face, which is how Angband has it.
# The limbs are struts spanning their own bones by naming them, with a knob
# at each joint and the muscle laid over as a prism, and the scruff down the
# neck and the spine is bristles: struts standing off the skin.
#
# The hide is a dirty yellow, the colour Angband gives it, paler down the
# belly and darker over the back, with the muzzle darker still and the nose
# black. The eyes are drawn unlit, so they read from every angle. It wears
# what it has taken: a ragged loincloth on a rope, a wrap at each wrist and
# each shin, a pouch and a bone on the belt, a cord of teeth, and in the
# right fist a flint knife bound to a stick, which is not mirrored, because
# there is only one of it.

id: kobold
name: Small kobold body
rig: ../rigs/kobold.rig.yaml

palette:
  hide: 0xb8953f
  hideDark: 0x8a6c2a
  hideLight: 0xd1b25e
  belly: 0xdcc684
  muzzle: 0xa2853a
  nose: 0x25201d
  eye: 0xff8c3a
  mouth: 0x3a1a1a
  gum: 0x8c4a52
  tongue: 0xb85a62
  tooth: 0xe8dfc8
  earInner: 0xc98a7a
  claw: 0x3a3330
  rag: 0x5a4636
  ragDark: 0x3f3025
  rope: 0x9a8455
  bone: 0xd9d0b8
  flint: 0x6d6f73
  flintEdge: 0x9c9ea2
  wood: 0x6b4a2e
  scruff: 0x4a3a22
  wart: 0x8f7233

parts:
