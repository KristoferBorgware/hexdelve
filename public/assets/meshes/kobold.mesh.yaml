  # The jaw: the lower muzzle, the lip and gum along its edge with the
  # lower fangs, the tongue lying in it, and a tuft under the chin.
  - { bone: jaw, at: [0, -0.015, 0.06], size: [0.038, 0.02, 0.065], color: hide }
