      - { bone: jaw, at: [0.025, 0.005, 0.115], size: [0.005, 0.016, 0.005], euler: [-0.1, 0, 0], color: tooth }

  # The ears: a dog's, broad at the root and pointed, standing up and out
  # from the corners of the skull and leaning back a little, the inside
  # paler, on bones of their own so they flick and lie back. The root sits
  # down in the skull so the ear grows out of the head.
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: 'ear*', at: [0.006, 0.01, 0], size: [0.022, 0.036, 0.014], euler: [-0.15, 0, -0.3], color: hide }
      - { bone: 'ear*', at: [0.018, 0.045, -0.002], size: [0.018, 0.05, 0.01], euler: [-0.15, 0, -0.3], color: hide }
      - { bone: 'ear*', at: [0.02, 0.045, 0.006], size: [0.011, 0.036, 0.005], euler: [-0.15, 0, -0.3], color: earInner }
      - { bone: 'ear*', from: [0.028, 0.068, -0.006], along: [0.35, 1, -0.15], length: 0.03, radius: 0.007, color: hide }

  # The arms: long for the body, the shoulder capped, the bone as a strut
  # with the muscle over it, the elbow, the forearm with a wrap of rag at
  # the wrist tied with cord, and a hand of three clawed fingers and a
  # clawed thumb.
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: 'arm*', at: [0, 0, 0], size: [0.04, 0.05, 0.04], color: hide }
      - { bone: 'arm*', from: [0, 0, 0], to: { bone: 'forearm*' }, radius: 0.028, color: hide }
      - { bone: 'arm*', at: [0, -0.08, 0.02], size: [0.025, 0.08, 0.022], color: hideLight }
      - { bone: 'forearm*', at: [0, 0, 0], size: [0.03, 0.03, 0.03], color: hideDark }
      - { bone: 'forearm*', from: [0, 0, 0], to: { bone: 'hand*' }, radius: 0.024, color: hide }
      - { bone: 'forearm*', at: [0, -0.14, 0], size: [0.028, 0.035, 0.028], color: rag }
      - { bone: 'forearm*', at: [0, -0.13, 0], size: [0.03, 0.006, 0.03], color: rope }
      - { bone: 'hand*', at: [0, -0.035, 0.005], size: [0.026, 0.05, 0.02], color: hide }
