  - { bone: root, at: [0, -0.02, 0], size: [0.12, 0.1, 0.09], color: hide }
  - { bone: root, at: [0, 0.02, 0], size: [0.13, 0.025, 0.1], color: rope }
  - { bone: root, at: [0, 0.02, 0.1], size: [0.02, 0.03, 0.02], color: rope }
  - { bone: root, from: [0.01, 0.01, 0.105], along: [0.3, -1, 0.1], length: 0.06, radius: 0.006, color: rope }
  - { bone: root, at: [0, -0.08, 0.085], size: [0.07, 0.14, 0.015], euler: [-0.1, 0, 0], color: rag }
  - { bone: root, at: [0.03, -0.13, 0.092], size: [0.025, 0.08, 0.012], euler: [-0.1, 0, 0.1], color: ragDark }
  - { bone: root, at: [-0.035, -0.115, 0.092], size: [0.022, 0.06, 0.012], euler: [-0.1, 0, -0.15], color: ragDark }
  - { bone: root, at: [0, -0.07, -0.08], size: [0.07, 0.12, 0.015], euler: [0.1, 0, 0], color: rag }
  - { bone: root, at: [-0.11, -0.04, 0.03], size: [0.03, 0.045, 0.025], color: ragDark }
  - { bone: root, at: [-0.11, -0.015, 0.03], size: [0.032, 0.012, 0.027], color: rope }
  - { bone: root, from: [0.1, 0.0, 0.06], along: [0.2, -1, 0.2], length: 0.07, radius: 0.008, color: bone }
  - { bone: root, at: [0.114, -0.068, 0.074], size: [0.011, 0.012, 0.011], color: bone }

  # The waist: the belly paler down the front, and the scruff starting up
  # the spine.
  - { bone: spine, at: [0, 0.05, 0], size: [0.11, 0.1, 0.085], color: hide }
  - { bone: spine, at: [0, 0.04, 0.07], size: [0.07, 0.09, 0.03], color: belly }
  - { bone: spine, at: [0, 0.05, -0.07], size: [0.05, 0.08, 0.03], color: hideDark }
  - { bone: spine, from: [0, 0.02, -0.085], along: [0, 0.3, -1], length: 0.035, radius: 0.006, color: scruff }
  - { bone: spine, from: [0, 0.06, -0.085], along: [0, 0.3, -1], length: 0.04, radius: 0.006, color: scruff }
  - { bone: spine, from: [0, 0.1, -0.08], along: [0, 0.4, -1], length: 0.04, radius: 0.006, color: scruff }

  # The chest: the ribcage with a paler plate down the front and a darker
  # one over the back, a shoulder either side, the scruff up the back, a
  # cord of teeth round the neck, a scar, and a wart.
  - { bone: chest, at: [0, 0.06, 0], size: [0.13, 0.15, 0.1], color: hide }
