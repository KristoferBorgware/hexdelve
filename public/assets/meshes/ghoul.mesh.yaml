# The ghoul: hexagonal prisms on the humanoid rig.
#
# Same bones, same trick, same rig as the wanderer — a body is still nothing
# but the unit hex prism under a different scale and rotation, bound to a bone.
# What is hung on them is what is left of a man once most of him has gone:
# a frame of long thin limbs with the bone showing at every joint, a ribcage
# torn open at the sternum, one ragged wrap at the waist, and a face that is
# more skull than face — the eyes sunk into pits with a glint at the bottom,
# no nose, one cheek gone through to the bone, and a jaw hanging open on two
# rows of teeth.
#
# The limbs are struts spanning their own bone by naming it — `to: { bone:
# forearm* }` is that bone's rest offset — with a knob of bone at each joint
# and a thin muscle or tendon laid beside the strut. The hands and feet end in
# claws: a finger is a joint strut and a claw strut off the end of it, so the
# fingers read as jointed rather than as a fan of spikes off the wrist.
#
# The eyes are drawn unlit, so the glint at the bottom of each pit reads from
# every angle whatever the light is doing.

id: ghoul
name: Ghoul body
rig: ../rigs/humanoid.rig.yaml

constants:
  # Seven torn strips round the hem, at even angles from a fifth of a turn
  # off the front — written as the fractions of a circle they are.
  strip0: (0 / 7) * tau + 0.2
  strip1: (1 / 7) * tau + 0.2
  strip2: (2 / 7) * tau + 0.2
  strip3: (3 / 7) * tau + 0.2
  strip4: (4 / 7) * tau + 0.2
  strip5: (5 / 7) * tau + 0.2
  strip6: (6 / 7) * tau + 0.2

palette:
  skin: 0x7f9a7c
  skinDark: 0x5c7360
  skinPale: 0x9cb397
  bone: 0xe4dcc2
  boneDark: 0xbdb193
  pit: 0x0b0a08
  eye: 0xd8e24c
  gum: 0x5a1a1a
  tooth: 0xefe9d3
  tongue: 0x7a2323
  wound: 0x3a221e
  rag: 0x8f7350
  ragDark: 0x6b5439
  cord: 0x40301f
  claw: 0xd4c49a
  hair: 0x2f2a25

parts:
  # Pelvis: a narrow bowl of bone with the hip crests standing proud of the
  # skin, and the one ragged wrap tied on round it with a cord.
  - { bone: root, at: [0, -0.03, 0], size: [0.15, 0.16, 0.11], color: skin }
  - { bone: root, at: [0, 0.02, -0.08], size: [0.03, 0.06, 0.025], color: bone }
  - { bone: root, at: [0, -0.06, 0.005], size: [0.165, 0.14, 0.125], color: rag }
  - { bone: root, at: [0, 0.01, 0], size: [0.17, 0.025, 0.13], color: cord }
  - { bone: root, at: [0.05, 0, 0.13], size: [0.03, 0.04, 0.02], color: cord }
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: root, at: [0.12, 0.03, -0.01], size: [0.035, 0.07, 0.05], euler: [0, 0, -0.3], color: bone }

  # Torn strips at angles round the hem, at uneven lengths and tilts, which
  # is what reads as cloth falling apart rather than cloth made that way.
  - { bone: root, at: [sin(strip0) * 0.14, -0.14, cos(strip0) * 0.11], size: [0.036, 0.1, 0.015], euler: [0.15, strip0, -0.1], color: rag }
  - { bone: root, at: [sin(strip1) * 0.14, -0.17, cos(strip1) * 0.11], size: [0.036, 0.15, 0.015], euler: [0.15, strip1, 0.1], color: ragDark }
  - { bone: root, at: [sin(strip2) * 0.14, -0.13, cos(strip2) * 0.11], size: [0.036, 0.09, 0.015], euler: [0.15, strip2, -0.1], color: rag }
  - { bone: root, at: [sin(strip3) * 0.14, -0.18, cos(strip3) * 0.11], size: [0.036, 0.16, 0.015], euler: [0.15, strip3, 0.1], color: ragDark }
  - { bone: root, at: [sin(strip4) * 0.14, -0.15, cos(strip4) * 0.11], size: [0.036, 0.11, 0.015], euler: [0.15, strip4, -0.1], color: rag }
  - { bone: root, at: [sin(strip5) * 0.14, -0.16, cos(strip5) * 0.11], size: [0.036, 0.14, 0.015], euler: [0.15, strip5, 0.1], color: ragDark }
  - { bone: root, at: [sin(strip6) * 0.14, -0.14, cos(strip6) * 0.11], size: [0.036, 0.1, 0.015], euler: [0.15, strip6, -0.1], color: rag }

  # Waist: a gaunt column with the belly sunk in under the ribs, and the
  # vertebrae standing out of the back in a row.
  - { bone: spine, at: [0, 0, -0.01], size: [0.12, 0.2, 0.095], color: skin }
  - { bone: spine, at: [0, -0.01, 0.075], size: [0.07, 0.14, 0.02], color: skinDark }
  - { bone: spine, at: [0, 0.07, -0.09], size: [0.022, 0.035, 0.02], color: bone }
  - { bone: spine, at: [0, 0, -0.09], size: [0.022, 0.035, 0.02], color: bone }
  - { bone: spine, at: [0, -0.07, -0.085], size: [0.022, 0.035, 0.02], color: bone }

  # The ribcage. A cage rather than a chest: the sternum has torn open and
  # stayed that way, a dark cavity with three exposed ribs crossing it, and
  # four ribs a side wrap round from it under the skin. Collarbones stand out
  # above and the shoulder blades behind, and more vertebrae run down the
  # back between them.
  - { bone: chest, at: [0, 0.06, 0], size: [0.16, 0.3, 0.12], color: skin }
  - { bone: chest, at: [0, 0.05, 0.075], size: [0.06, 0.2, 0.03], color: wound }
  - { bone: chest, at: [0, 0.12, 0.085], size: [0.05, 0.016, 0.014], color: bone }
  - { bone: chest, at: [0, 0.05, 0.085], size: [0.046, 0.016, 0.014], color: boneDark }
  - { bone: chest, at: [0, -0.02, 0.085], size: [0.042, 0.016, 0.014], color: bone }
  - { bone: chest, at: [0, 0.16, -0.12], size: [0.022, 0.035, 0.02], color: bone }
  - { bone: chest, at: [0, 0.08, -0.12], size: [0.022, 0.035, 0.02], color: bone }
  - { bone: chest, at: [0, 0, -0.115], size: [0.022, 0.035, 0.02], color: bone }
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: chest, at: [0.09, 0.14, 0.06], size: [0.075, 0.018, 0.02], euler: [0, -0.5, -0.15], color: bone }
      - { bone: chest, at: [0.09, 0.075, 0.06], size: [0.075, 0.018, 0.02], euler: [0, -0.5, -0.15], color: boneDark }
      - { bone: chest, at: [0.09, 0.01, 0.06], size: [0.072, 0.018, 0.02], euler: [0, -0.5, -0.15], color: bone }
      - { bone: chest, at: [0.088, -0.055, 0.06], size: [0.068, 0.018, 0.02], euler: [0, -0.5, -0.15], color: boneDark }
      - { bone: chest, at: [0.1, 0.24, 0.05], size: [0.09, 0.016, 0.016], euler: [0, 0.15, -0.2], color: bone }
      - { bone: chest, at: [0.09, 0.15, -0.075], size: [0.05, 0.1, 0.02], euler: [0.1, 0, -0.25], color: skinDark }
  # The one scrap of what was once a shirt, hanging off the right shoulder.
  - { bone: chest, at: [-0.14, 0.2, 0], size: [0.05, 0.12, 0.08], euler: [0.1, 0, 0.35], color: ragDark }

  # Neck: a thin column with the tendons standing out either side of it and
  # a vertebra at the back.
  - { bone: neck, at: [0, 0.02, 0], size: [0.045, 0.16, 0.045], color: skin }
  - { bone: neck, at: [0, 0.05, -0.05], size: [0.02, 0.04, 0.02], color: bone }
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: neck, at: [0.035, 0.04, 0.02], size: [0.012, 0.13, 0.012], euler: [0, 0, -0.15], color: skinDark }

  # The head. A narrow skull with the bone bare on top, a heavy brow over
  # two pits with an eye at the bottom of each, cheekbones standing out of
  # hollow cheeks, a hole where the nose was, and the jaw hanging open.
  - { bone: head, at: [0, 0.04, -0.01], size: [0.105, 0.19, 0.115], color: skin }
  - { bone: head, at: [0, 0.13, -0.03], size: [0.085, 0.045, 0.095], color: bone }
  - { bone: head, at: [0, 0.105, 0.06], size: [0.08, 0.03, 0.03], euler: [0.4, 0, 0], color: skinDark }
  - { bone: head, at: [0, 0.075, 0.1], size: [0.1, 0.03, 0.03], euler: [0.3, 0, 0], color: skinDark }
  - { bone: head, at: [0, 0.015, 0.12], size: [0.02, 0.035, 0.014], color: pit }
  - { bone: head, at: [0, 0.04, 0.125], size: [0.016, 0.03, 0.012], euler: [0.3, 0, 0], color: bone }
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: head, at: [0.045, 0.085, 0.095], size: [0.04, 0.025, 0.03], euler: [0.3, 0, -0.25], color: bone }
      - { bone: head, at: [0.045, 0.045, 0.1], size: [0.036, 0.04, 0.03], color: pit }
      - { bone: head, at: [0.045, 0.045, 0.125], size: [0.013, 0.012, 0.008], color: eye, unlit: true }
      - { bone: head, at: [0.07, 0.02, 0.085], size: [0.028, 0.025, 0.03], euler: [0, 0.3, 0.2], color: bone }
      - { bone: head, at: [0.08, -0.03, 0.05], size: [0.03, 0.08, 0.055], euler: [0, 0.25, 0.15], color: skinDark }

  # The upper jaw and its teeth: a gum with six teeth hanging from it, the
  # two at the corners longer than the rest.
  - { bone: head, at: [0, -0.055, 0.085], size: [0.075, 0.05, 0.07], color: skin }
  - { bone: head, at: [0, -0.085, 0.095], size: [0.065, 0.02, 0.06], color: gum }
  - { bone: head, at: [0.045, -0.115, 0.13], size: [0.009, 0.045, 0.008], euler: [0.1, 0, -0.1], color: tooth }
  - { bone: head, at: [0.027, -0.105, 0.135], size: [0.007, 0.03, 0.006], euler: [0.1, 0, 0], color: tooth }
  - { bone: head, at: [0.009, -0.107, 0.137], size: [0.007, 0.032, 0.006], euler: [0.1, 0, 0], color: tooth }
  - { bone: head, at: [-0.009, -0.105, 0.137], size: [0.007, 0.03, 0.006], euler: [0.1, 0, 0], color: tooth }
  - { bone: head, at: [-0.027, -0.108, 0.135], size: [0.007, 0.034, 0.006], euler: [0.1, 0, 0], color: tooth }
  - { bone: head, at: [-0.045, -0.115, 0.13], size: [0.009, 0.045, 0.008], euler: [0.1, 0, 0.1], color: tooth }

  # The lower jaw, hanging: bone showing along the edge of it, the dark of
  # the mouth and a tongue behind the lower teeth, which stand up to meet the
  # upper ones — five, and two longer at the corners.
  - { bone: head, at: [0, -0.11, 0.075], size: [0.045, 0.03, 0.045], color: pit }
  - { bone: head, at: [0, -0.125, 0.06], size: [0.02, 0.014, 0.045], color: tongue }
  - { bone: head, at: [0, -0.15, 0.06], size: [0.055, 0.04, 0.075], color: skin }
  - { bone: head, at: [0, -0.165, 0.045], size: [0.05, 0.02, 0.06], color: bone }
  - { bone: head, at: [0, -0.16, 0.1], size: [0.03, 0.03, 0.03], color: skinDark }
  - { bone: head, at: [0, -0.13, 0.085], size: [0.05, 0.016, 0.055], color: gum }
  - { bone: head, at: [0.035, -0.118, 0.12], size: [0.008, 0.04, 0.007], euler: [-0.1, 0, -0.1], color: tooth }
  - { bone: head, at: [0.018, -0.118, 0.125], size: [0.006, 0.026, 0.006], euler: [-0.1, 0, 0], color: tooth }
  - { bone: head, at: [0, -0.12, 0.127], size: [0.006, 0.028, 0.006], euler: [-0.1, 0, 0], color: tooth }
  - { bone: head, at: [-0.018, -0.118, 0.125], size: [0.006, 0.026, 0.006], euler: [-0.1, 0, 0], color: tooth }
  - { bone: head, at: [-0.035, -0.118, 0.12], size: [0.008, 0.04, 0.007], euler: [-0.1, 0, 0.1], color: tooth }

  # One ear left, torn; the other side of the head gone through to the bone.
  # And what is left of the hair, as four wisps off the back of the skull.
  - { bone: head, at: [0.075, 0.03, -0.02], size: [0.02, 0.06, 0.035], euler: [0.1, 0.25, 0.25], color: skinDark }
  - { bone: head, at: [-0.072, 0, 0.03], size: [0.025, 0.07, 0.05], euler: [0, -0.3, 0], color: bone }
  - { bone: head, from: [0.03, 0.12, -0.08], along: [0.2, 0.3, -1], length: 0.09, radius: 0.008, color: hair }
  - { bone: head, from: [-0.02, 0.1, -0.09], along: [-0.3, 0.1, -1], length: 0.11, radius: 0.008, color: hair }
  - { bone: head, from: [0.05, 0.08, -0.07], along: [0.5, -0.2, -1], length: 0.08, radius: 0.008, color: hair }
  - { bone: head, from: [-0.04, 0.13, -0.06], along: [-0.2, 0.5, -1], length: 0.07, radius: 0.008, color: hair }

  # Arms: a strut along each bone, thin as the bone itself, a knob of bone at
  # the shoulder, the elbow and the wrist, a tendon down the forearm, and the
  # bone bare along the upper arm. The hand is a narrow palm turned to face
  # the body, as a hanging hand's does, with four jointed fingers spread
  # across it front to back — each a short strut with a long claw off the
  # end, curling in towards the palm — and a thumb ahead of them.
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: 'arm*', from: [0, 0, 0], to: { bone: 'forearm*' }, radius: 0.03, color: skin }
      - { bone: 'arm*', at: [0, -0.03, 0], size: [0.045, 0.08, 0.045], color: skin }
      - { bone: 'arm*', at: [0.02, -0.17, 0], size: [0.018, 0.12, 0.014], euler: [0, 0, -0.1], color: bone }
      - { bone: 'forearm*', at: [0, 0, 0], size: [0.036, 0.05, 0.036], color: boneDark }
      - { bone: 'forearm*', from: [0, 0, 0], to: { bone: 'hand*' }, radius: 0.024, color: skin }
      - { bone: 'forearm*', at: [0, -0.15, 0.02], size: [0.012, 0.22, 0.01], color: skinDark }
      - { bone: 'hand*', at: [0, 0, 0], size: [0.028, 0.035, 0.024], color: bone }
      - { bone: 'hand*', at: [0, -0.045, 0.005], size: [0.02, 0.07, 0.038], color: skin }
      - { bone: 'hand*', at: [-0.004, -0.085, 0.005], size: [0.018, 0.02, 0.04], color: skinDark }
      - { bone: 'hand*', from: [0, -0.09, -0.03], along: [-0.15, -1, -0.3], length: 0.06, radius: 0.01, color: skinDark }
      - { bone: 'hand*', from: [-0.009, -0.15, -0.048], along: [-0.7, -0.7, -0.2], length: 0.08, radius: 0.008, color: claw }
      - { bone: 'hand*', from: [0, -0.09, -0.01], along: [-0.15, -1, -0.1], length: 0.065, radius: 0.01, color: skinDark }
      - { bone: 'hand*', from: [-0.01, -0.155, -0.017], along: [-0.7, -0.7, -0.05], length: 0.09, radius: 0.008, color: claw }
      - { bone: 'hand*', from: [0, -0.09, 0.01], along: [-0.15, -1, 0.1], length: 0.065, radius: 0.01, color: skinDark }
      - { bone: 'hand*', from: [-0.01, -0.155, 0.017], along: [-0.7, -0.7, 0.05], length: 0.09, radius: 0.008, color: claw }
      - { bone: 'hand*', from: [0, -0.09, 0.03], along: [-0.15, -1, 0.3], length: 0.06, radius: 0.01, color: skinDark }
      - { bone: 'hand*', from: [-0.009, -0.15, 0.048], along: [-0.7, -0.7, 0.2], length: 0.08, radius: 0.008, color: claw }
      - { bone: 'hand*', from: [-0.015, -0.04, 0.03], along: [-0.5, -0.6, 0.8], length: 0.05, radius: 0.009, color: skinDark }
      - { bone: 'hand*', from: [-0.04, -0.07, 0.07], along: [-0.8, -0.6, 0.3], length: 0.06, radius: 0.007, color: claw }

  # Legs: the same again. A strut along the thigh with a wasted muscle laid
  # beside it and the femur bare on the outside, a knob at the knee, a strut
  # down the shin with the bone ridged along its front and a calf behind, a
  # knob at the ankle, and a long narrow foot ending in four clawed toes. The
  # toes are symmetric about the foot's own centre line, so they do not
  # mirror.
  - sides: [L, R]
    mirror: true
    parts:
      - { bone: 'hip*', from: [0, 0, 0], to: { bone: 'shin*' }, radius: 0.038, color: skin }
      - { bone: 'hip*', at: [0, -0.167, -0.01], size: [0.045, 0.251, 0.045], color: skin }
      - { bone: 'hip*', at: [0.03, -0.263, 0.01], size: [0.015, 0.105, 0.012], color: bone }
      - { bone: 'shin*', at: [0, 0, 0.01], size: [0.045, 0.064, 0.045], color: boneDark }
      - { bone: 'shin*', from: [0, 0, 0], to: { bone: 'foot*' }, radius: 0.028, color: skin }
      - { bone: 'shin*', at: [0, -0.179, 0.03], size: [0.012, 0.296, 0.01], color: bone }
      - { bone: 'shin*', at: [0, -0.127, -0.03], size: [0.03, 0.169, 0.03], color: skinDark }
      - { bone: 'foot*', at: [0, 0, 0], size: [0.03, 0.04, 0.03], color: bone }
      - { bone: 'foot*', at: [0, -0.045, 0.05], size: [0.04, 0.09, 0.09], color: skinDark }
      - { bone: 'foot*', at: [0, -0.05, -0.03], size: [0.03, 0.08, 0.03], color: skin }
      - mirror: false
        parts:
          - { bone: 'foot*', at: [-0.03, -0.07, 0.12], size: [0.012, 0.03, 0.02], color: skinDark }
          - { bone: 'foot*', at: [-0.01, -0.07, 0.125], size: [0.012, 0.03, 0.02], color: skinDark }
          - { bone: 'foot*', at: [0.01, -0.07, 0.125], size: [0.012, 0.03, 0.02], color: skinDark }
          - { bone: 'foot*', at: [0.03, -0.07, 0.12], size: [0.012, 0.03, 0.02], color: skinDark }
          - { bone: 'foot*', from: [-0.03, -0.075, 0.13], along: [-0.4, -0.35, 1], length: 0.1, radius: 0.01, color: claw }
          - { bone: 'foot*', from: [-0.01, -0.075, 0.135], along: [-0.15, -0.35, 1], length: 0.1, radius: 0.01, color: claw }
          - { bone: 'foot*', from: [0.01, -0.075, 0.135], along: [0.15, -0.35, 1], length: 0.1, radius: 0.01, color: claw }
          - { bone: 'foot*', from: [0.03, -0.075, 0.13], along: [0.4, -0.35, 1], length: 0.1, radius: 0.01, color: claw }
