# The mummified human: hexagonal prisms on the humanoid rig.
#
# Same bones and same rig as the wanderer, the ghoul and the zombie. Where the
# zombie is a body the flesh is still going from, this is one it went from
# long ago: a man dried to leather and bound, and what is drawn is mostly
# the binding. Every bone is wound in bands of linen, each band a prism a
# little turned and a little tilted against its neighbours, so the wrapping
# reads as wound rather than moulded, in linen gone three shades of dirty
# with the mould on it. Under the bands each limb is a strut of dark dried
# flesh, so where they gap what shows is what is inside.
#
# The wrappings have come away in places — the left forearm, the right
# thigh, the right side of the belly with the ribs across the hole, and the
# jaw, which is bare to the teeth — and the loose ends trail from the head,
# the shoulders, the elbows and the heels. One eye is left in the slit the
# wrappings leave for them, drawn unlit so it shows from every angle; the
# other socket is empty. A scarab of gold on a cord lies on the chest, a
# gold band is on the right wrist, and a broken collar of gold and blue
# stone is at the neck: what it was buried with.

