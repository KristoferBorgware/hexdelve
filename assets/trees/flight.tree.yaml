# The bat's flight tree: one axis, from asleep to working.
#
# Deliberately the plain case next to the humanoid's. A single blend1d over
# three leaves is what most of a real tree is made of, and it is worth being
# able to look at one without four parameters on top of it.
#
# No speed measured off anything here. It has feet, but nothing it does with
# them is walking, so a ground speed read off them would be a number about
# nothing — which is why the bat's rig declares no `feet` and this tree's one
# axis is a plain 0 to 1.

id: flight
label: Flight tree
rig: ../rigs/bat.rig.yaml
fallbackCycle: fly

parameters:
  - name: effort
    label: Effort
    min: 0
    max: 1
    step: 0.01
    initial: 1
    hint: Asleep on its feet, hovering, or working the wings

root:
  blend1d:
    param: effort
    label: effort, 0 to 1
    entries:
      - { at: 0, node: { leaf: perch } }
      - { at: 0.5, node: { leaf: hover } }
      - { at: 1, node: { leaf: fly } }
